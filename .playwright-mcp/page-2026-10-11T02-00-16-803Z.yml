          - paragraph [ref=f18e78]:
            - text: I created Nandland.com after struggling to learn about FPGAs as a young engineer. I recall googling issues I was having, only to find forum threads with someone asking the exact same question I had, but with no answer given. I wanted to fix this, so I started blogging about what I learned along the way. With these humble beginnings, Nandland.com has grown significantly, and so have I as an engineer. I look forward to continuing the journey of spreading this knowledge to the world, and I thank you for
            - strong [ref=f18e79]:
