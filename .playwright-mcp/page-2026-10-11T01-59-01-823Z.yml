        - generic [ref=f10e111]:
          - heading "About this course" [level=2] [ref=f10e112]
          - generic [ref=f10e113]:
            - generic [ref=f10e116]:
              - paragraph [ref=f10e117]: "The course lectures will be presented in short videos. To help you master the material, there will be in-lecture questions to answer, quizzes, and two exams: a midterm and a final. There will also be homework in the form of exercises that ask you to show a sequence of logical steps needed to derive a specific result, such as the sequence of steps a type checker would perform to type check a piece of code, or the sequence of steps a parser would perform to parse an input string. This checking technology is the result of ongoing research at Stanford into developing innovative tools for education, and we're excited to be the first course ever to make it available to students."
              - paragraph [ref=f10e118]: An optional course project is to write a complete compiler for COOL, the Classroom Object Oriented Language. COOL has the essential features of a realistic programming language, but is small and simple enough that it can be implemented in a few thousand lines of code. Students who choose to do the project can implement it in either C++ or Java.
              - paragraph [ref=f10e119]: I hope you enjoy the course!
