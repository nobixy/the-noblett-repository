          - paragraph [ref=f10e43]: "StanfordOnline: Compilers"
          - generic [ref=f10e44]:
            - paragraph [ref=f10e46]: This self-paced course will discuss the major ideas used today in the implementation of programming language compilers, including lexical analysis, parsing, syntax-directed translation, abstract syntax trees, types and type checking, intermediate languages, dataflow analysis, program optimization, code generation, and runtime systems. As a result, you will learn how a program written in a high-level language designed for humans is systematically translated into a program written in low-level assembly more suited to machines. Along the way we will also touch on how programming languages are designed, programming language semantics, and why there are so many different kinds of programming languages.
            - button "Show More" [ref=f10e47] [cursor=pointer]
